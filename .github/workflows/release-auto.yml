name: Release from main

# Releases Vortia when a new version lands on main: set project(VERSION) in CMakeLists.txt and
# write its "## [X.Y.Z]" section in CHANGELOG.md in the same pull request, then merge it.
# Foundation's release-tag tags the merge and drafts the release with that section as its text,
# release-appimage.yml builds, starts and attaches the AppImage and the DMGs, and release-publish
# publishes it once they are there. A failed package leaves the release a draft. Any other push
# does nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-auto
  cancel-in-progress: false

jobs:
  tag:
    permissions:
      contents: write
    uses: getnodalia/foundation/.github/workflows/release-tag.yml@a34cd29a25557813b1392b5378a55a837fb5d2ac # foundation 2026-11-13
    with:
      name: Vortia
      version-command: sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt | head -n 1
      # The version's CHANGELOG section, without its heading.
      notes-command: awk -v h="## [$VERSION]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md

  packages:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-appimage.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  publish:
    needs: [tag, packages]
    permissions:
      contents: write
    uses: getnodalia/foundation/.github/workflows/release-publish.yml@a34cd29a25557813b1392b5378a55a837fb5d2ac # foundation 2026-11-13
    with:
      tag: ${{ needs.tag.outputs.tag }}
