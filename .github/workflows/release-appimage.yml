name: Release packages

# Builds the Linux AppImage and the macOS DMG, starts both on clean machines
# and only then attaches them to a GitHub Release.
#
# Release procedure: create a DRAFT release vX.Y.Z on main, run this workflow
# with tag=vX.Y.Z, check the attached files, then publish the draft. There is
# deliberately no "release: published" trigger: it rebuilt and replaced the
# files that had just been verified.

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "src/**"
      - "resources/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/release-appimage.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "src/**"
      - "resources/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/release-appimage.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (draft or published) to attach the packages to, e.g. v0.3.0. Leave empty to only upload workflow artifacts."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: packages-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      appimage: ${{ steps.ver.outputs.appimage }}
      dmg: ${{ steps.ver.outputs.dmg }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        env:
          TAG: ${{ inputs.tag || '' }}
        run: |
          project="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt | head -n1)"
          test -n "$project"
          if [[ -n "$TAG" ]]; then
            version="${TAG#v}"
            # A tag must describe the code it is built from.
            if [[ "$version" != "$project" ]]; then
              echo "Tag $TAG does not match project(VERSION $project)" >&2
              exit 1
            fi
          else
            # An untagged CI run must NEVER overwrite an existing GitHub Release.
            version="$project"
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "appimage=Vortia-${version}-linux-x86_64.AppImage"
            echo "dmg=Vortia-${version}-macos-arm64.dmg"
          } >> "$GITHUB_OUTPUT"

  linux-openfoam-engine:
    # The CFD engine shipped inside the AppImage. Rebuilt only when its
    # recipe changes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v6
        id: cache
        with:
          path: openfoam-engine.tar
          key: openfoam-engine-${{ hashFiles('packaging/linux/build_openfoam_payload.sh', 'packaging/common/build_mesher_runtime.sh') }}
      - name: Assemble relocatable OpenFOAM in Ubuntu 20.04
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir payload
          docker run --rm -v "$PWD:/work" -w /work \
            -e VORTIA_APT_MIRROR=https://mirrors.edge.kernel.org/ubuntu ubuntu:20.04 \
            bash packaging/linux/build_openfoam_payload.sh /work/payload 2412
          sudo tar -C payload -cf openfoam-engine.tar .
          sudo chown "$(id -u)" openfoam-engine.tar
          ls -lh openfoam-engine.tar
      - uses: actions/upload-artifact@v4
        with:
          name: linux-openfoam-engine
          path: openfoam-engine.tar
          if-no-files-found: error
          retention-days: 3

  native-verification:
    # Numerical verification with the very engine that ships in the AppImage:
    # Poiseuille and the Ghia cavity are solved and compared with their
    # references. A skipped benchmark is a failure here.
    needs: linux-openfoam-engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-openfoam-engine
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev nlohmann-json3-dev libhdf5-dev
          mkdir engine && tar -C engine -xf openfoam-engine.tar && rm openfoam-engine.tar
      - name: Build (no UI)
        run: |
          cmake -S . -B build -G Ninja -DVORTIA_BUILD_UI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Solve and compare with the packaged engine
        shell: bash
        run: |
          set -o pipefail
          root="$(echo "$PWD"/engine/OpenFOAM-v*)"
          # The engine bashrc is not written for "set -e" / "set -u".
          set +eu
          source "$root/etc/bashrc"
          source "$root/etc/vortia-runtime.sh"
          set -eu
          test "$WM_PROJECT_DIR" = "$root"
          for tool in simpleFoam blockMesh mpirun; do command -v "$tool"; done
          export VORTIA_NATIVE_OF_ROOT="$root"
          # Verbose: the measured errors are the evidence, pass or fail.
          ctest --test-dir build -V \
            -R 'benchmark_|EngineSelfTest|NativeInstalledEnvironmentSmoke' | tee native-verification.log
          if grep -E 'Skipped|Not Run' native-verification.log; then
            echo "A native verification test did not run" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification
          path: |
            native-verification.log
            build/benchmark-native/**/log.*
            build/benchmark-native/**/postProcessing/**
            build/benchmark-native/**/*.csv
          retention-days: 30

  linux-appimage:
    needs: [version, linux-openfoam-engine]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSET: ${{ needs.version.outputs.appimage }}
    steps:
      - uses: actions/checkout@v4

      # No system -dev packages, and the conda sysroot pinned to glibc 2.28
      # (unpinned, the solver picks the newest one, 2.39): the executable
      # must not need a newer C library than the oldest supported distribution.

      - name: Setup micromamba (Qt6 + VTK)
        # Pin to the commit currently tagged as v2 (Sonar githubactions:S7637).
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: vortia
          cache-environment: true
          create-args: >-
            -c conda-forge
            cmake
            ninja
            cxx-compiler
            sysroot_linux-64=2.28
            pkg-config
            qt6-main
            vtk
            nlohmann_json
            hdf5
            gtest
            mesalib
            libopengl
            libgl-devel
            libegl-devel
            libopengl-devel
            libglx-devel
            xorg-libx11
            xorg-libxext
            xorg-libxrender
            xorg-libxcb
            libxcb

      - name: Configure
        run: |
          # The conda toolchain targets an old glibc through its own sysroot.
          # The runner's /usr/bin/c++ would tie the binary to Ubuntu 24.04.
          # micromamba's login-shell activation does not run the compiler
          # packages' activate.d scripts, so do it here (0.2.x was silently
          # built by the runner's compiler for this reason).
          echo "CONDA_PREFIX=$CONDA_PREFIX"
          ls "$CONDA_PREFIX/etc/conda/activate.d" || true
          export CC="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc"
          export CXX="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++"
          test -x "$CC" && test -x "$CXX"
          "$CXX" --version | head -n1
          "$CXX" -print-sysroot
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVORTIA_BUILD_UI=ON \
            -DVORTIA_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DCMAKE_IGNORE_PREFIX_PATH="/usr;/usr/local"
          if grep -n -- '-isystem /usr/include\|-I/usr/include' build/build.ninja | head -n 5 | grep .; then
            echo "System include directories leaked into the build" >&2
            exit 1
          fi

      - name: Build
        run: |
          cmake --build build --parallel "$(nproc)"
          test -x build/bin/vortia
          test -s build/vortia_es.qm
          echo "glibc symbol versions needed by the executable:"
          "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-objdump" -T build/bin/vortia |
            grep -o 'GLIBC_[0-9][0-9.]*' | sort -u -V | tail -n 3

      - uses: actions/download-artifact@v4
        with:
          name: linux-openfoam-engine

      - name: Create AppImage
        run: |
          mkdir openfoam-engine && tar -C openfoam-engine -xf openfoam-engine.tar && rm openfoam-engine.tar
          export VORTIA_OPENFOAM_PAYLOAD="$PWD/openfoam-engine"
          export CMAKE_BINARY_DIR="$PWD/build"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QMAKE="$CONDA_PREFIX/bin/qmake"
          mkdir -p dist
          bash packaging/linux/create_appimage.sh \
            "$PWD/build/bin/vortia" "$PWD/dist/$ASSET" "$VERSION"
          test -x "dist/$ASSET"
          ls -lh dist/
          (cd dist && sha256sum "$ASSET" > "${ASSET}.sha256")
          (cd dist && sha256sum -c "${ASSET}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/
          if-no-files-found: error

  linux-clean-distros:
    # Bare distribution images plus only what any desktop install has
    # (X server, Mesa, fontconfig). No Qt, no xcb-util, no newer libstdc++.
    needs: [version, linux-appimage]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - "ubuntu:20.04"
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:12"
          - "debian:13"
          - "fedora:latest"
          - "archlinux:latest"
          - "opensuse/tumbleweed:latest"
          - "rockylinux:9"
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist
      - name: Desktop baseline packages
        run: sh packaging/linux/install_smoke_deps.sh
      - name: Start the AppImage as a user would
        env:
          VORTIA_EXPECT_ENGINE: "1"
        run: bash packaging/linux/smoke_test_appimage.sh "dist/${{ needs.version.outputs.appimage }}"

  linux-direct-run:
    # Real virtual machines (not containers): run the image file itself, so
    # the AppImage runtime mounts it through FUSE exactly like a double click.
    needs: [version, linux-appimage]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist
      - name: X server and Mesa
        run: |
          echo 'Acquire::Retries "8"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-vortia-retries
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libgl1-mesa-dri libglx-mesa0 openbox xdotool x11-utils
      - name: Start the AppImage directly
        env:
          VORTIA_EXPECT_ENGINE: "1"
          VORTIA_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: bash packaging/linux/smoke_test_appimage.sh "dist/${{ needs.version.outputs.appimage }}" --fuse
      - name: Move, resize, maximize and close through the integrated top bar
        run: bash packaging/linux/window_chrome_test.sh "dist/${{ needs.version.outputs.appimage }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots-${{ matrix.os }}
          path: screenshots/
          retention-days: 14

  macos-dmg:
    needs: version
    # Oldest Apple Silicon runner GitHub still offers. Qt/VTK come from
    # conda-forge (built for old macOS), not Homebrew bottles (built only
    # for the runner's own macOS version).
    runs-on: macos-15
    defaults:
      run:
        shell: bash -el {0}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSET: ${{ needs.version.outputs.dmg }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4

      - name: Setup micromamba (Qt6 + VTK)
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: vortia
          cache-environment: true
          create-args: >-
            -c conda-forge
            cmake
            ninja
            cxx-compiler
            qt6-main
            vtk
            nlohmann_json
            hdf5

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVORTIA_BUILD_UI=ON \
            -DVORTIA_BUILD_TESTS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DCMAKE_IGNORE_PREFIX_PATH="/opt/homebrew;/usr/local"

      - name: Build app bundle
        run: |
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"
          cmake --build build --target vortia_macos_bundle
          test -s build/Vortia.app/Contents/Resources/Vortia.icns

      - name: Integrate the OpenFOAM engine
        env:
          # Native Apple Silicon OpenFOAM v2606 from gerlero/openfoam-app v2.2.3.
          ENGINE_URL: https://github.com/gerlero/openfoam-app/releases/download/v2.2.3/openfoam2606-app-arm64.zip
          ENGINE_SHA256: 22456639168cff9fab89335224e5dfe2627e7942e93e99bd0540f60d89679e49
        run: |
          mkdir engine && cd engine
          curl -fsSL --proto '=https' --tlsv1.2 "$ENGINE_URL" -o engine.zip
          echo "$ENGINE_SHA256  engine.zip" | shasum -a 256 -c -
          ditto -x -k engine.zip . && rm engine.zip
          image="$(find "$PWD" -name 'OpenFOAM-v2606.dmg' | head -n 1)"
          test -s "$image"
          cd ..
          /usr/bin/python3 packaging/macos/bundle_openfoam.py "$image" "$PWD/build/Vortia.app"
          cat build/Vortia.app/Contents/Resources/OpenFOAM-v2606/MINIMUM_MACOS
          rm -rf engine

      - name: Integrate the mesher (Python + Gmsh)
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            bash packaging/common/build_mesher_runtime.sh "$PWD/mesher"
          cp -a mesher/python mesher/gmsh build/Vortia.app/Contents/Resources/
          rm -rf mesher

      - name: Bundle Qt/VTK and sign ad-hoc
        run: |
          cocoa="$(find "$CONDA_PREFIX" -name libqcocoa.dylib -not -path '*/pkgs/*' | head -n 1)"
          test -n "$cocoa"
          plugins="$(dirname "$(dirname "$cocoa")")"
          echo "Qt plugins: $plugins"
          # Fail the release instead of shipping a DMG that silently needs a
          # newer macOS than the release notes say.
          /usr/bin/python3 packaging/macos/deploy_bundle.py build/Vortia.app "$plugins" \
            --search "$CONDA_PREFIX/lib" --max-min-macos 14.0
          du -sh build/Vortia.app

      - name: Start the bundle outside the build environment
        run: |
          micromamba deactivate || true
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin VORTIA_EXPECT_ENGINE=1 \
            bash packaging/macos/smoke_test_app.sh build/Vortia.app

      - name: Create DMG
        run: |
          mkdir -p dist
          bash packaging/macos/create_dmg.sh build/Vortia.app "dist/$ASSET" "$VERSION"
          (cd dist && shasum -a 256 "$ASSET" > "${ASSET}.sha256")
          (cd dist && shasum -a 256 -c "${ASSET}.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/
          if-no-files-found: error

  macos-clean-machines:
    # Fresh runners without the build environment: mount the DMG, copy the
    # app out and start it, on every macOS version GitHub offers for arm64.
    needs: [version, macos-dmg]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist
      - name: Install from the DMG and start
        run: |
          sw_vers
          (cd dist && shasum -a 256 -c "${{ needs.version.outputs.dmg }}.sha256")
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "dist/${{ needs.version.outputs.dmg }}"
          install="$(mktemp -d)"
          ditto "$mount/Vortia.app" "$install/Vortia.app"
          hdiutil detach "$mount"
          VORTIA_EXPECT_ENGINE=1 bash packaging/macos/smoke_test_app.sh "$install/Vortia.app"

  attach-to-release:
    # Nothing reaches a release unless every start-up test above passed.
    needs: [version, native-verification, linux-clean-distros, linux-direct-run, macos-clean-machines]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach packages to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -lh dist/
          gh release upload "$TAG" \
            "dist/${{ needs.version.outputs.appimage }}" \
            "dist/${{ needs.version.outputs.appimage }}.sha256" \
            "dist/${{ needs.version.outputs.dmg }}" \
            "dist/${{ needs.version.outputs.dmg }}.sha256" \
            --repo "${{ github.repository }}" \
            --clobber
