name: Release AppImage

on:
  push:
    branches: [main]
    paths:
      - "packaging/linux/**"
      - "src/app/main.cpp"
      - ".github/workflows/release-appimage.yml"
  pull_request:
    paths:
      - "packaging/linux/**"
      - "src/app/main.cpp"
      - ".github/workflows/release-appimage.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the AppImage to (e.g. v0.2.1). Leave empty to only upload the workflow artifact."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-appimage:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag || '' }}"
          if [[ -n "$tag" ]]; then
            version="${tag#v}"
          else
            # An untagged CI run must NEVER overwrite an existing GitHub Release.
            version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt | head -n1)"
          fi
          test -n "$version"
          asset="Vortia-${version}-linux-x86_64.AppImage"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "asset=$asset"
          } >> "$GITHUB_OUTPUT"

      - name: System packages for OpenGL / X11
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libegl1 xvfb xauth curl ca-certificates

      - name: Setup micromamba (Qt6 + VTK)
        # Pin to the commit currently tagged as v2 (Sonar githubactions:S7637).
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: vortia
          cache-environment: true
          create-args: >-
            -c conda-forge
            cmake
            ninja
            cxx-compiler
            pkg-config
            qt6-main
            vtk
            nlohmann_json
            hdf5
            gtest
            mesalib
            libopengl
            xorg-libx11
            xorg-libxext
            xorg-libxrender
            xorg-libxcb
            libxcb

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVORTIA_BUILD_UI=ON \
            -DVORTIA_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"

      - name: Build
        run: |
          cmake --build build --parallel "$(nproc)"
          test -x build/bin/vortia
          test -s build/vortia_es.qm

      - name: Smoke-test binary
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # OpenFOAM is not bundled in this AppImage; --verify-engine exits 3 by design.
          build/bin/vortia --verify-spanish

      - name: Create AppImage
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ASSET: ${{ steps.ver.outputs.asset }}
        run: |
          chmod +x packaging/linux/create_appimage.sh
          export CMAKE_BINARY_DIR="$PWD/build"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QMAKE="$CONDA_PREFIX/bin/qmake"
          mkdir -p dist
          packaging/linux/create_appimage.sh \
            "$PWD/build/bin/vortia" \
            "$PWD/dist/$ASSET" \
            "$VERSION"
          test -x "dist/$ASSET"
          ls -lh dist/
          (cd dist && sha256sum "$ASSET" > "${ASSET}.sha256")
          (cd dist && sha256sum -c "${ASSET}.sha256")

      - name: Smoke-test AppImage with real Qt graphical platform
        env:
          ASSET: ${{ steps.ver.outputs.asset }}
        run: |
          set -euo pipefail
          chmod +x "dist/$ASSET"
          sh -n packaging/linux/AppRun
          # The old smoke test created only QCoreApplication. It could pass
          # when libqxcb.so existed but the AppImage had no plugin search path.
          "dist/$ASSET" --appimage-extract-and-run --verify-spanish
          # Simulate a clean end-user machine (no conda/Qt env overrides),
          # open a real QWidget on Xvfb, and check the bundled xcb plugin.
          timeout 45s env -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH -u QT_QPA_PLATFORM_PLUGIN_PATH \
            -u QT_QPA_PLATFORM \
            xvfb-run -a "dist/$ASSET" --appimage-extract-and-run --verify-qt-platform

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.asset }}
          path: |
            dist/${{ steps.ver.outputs.asset }}
            dist/${{ steps.ver.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Attach AppImage to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          ASSET: ${{ steps.ver.outputs.asset }}
        run: |
          gh release upload "$TAG" \
            "dist/$ASSET" \
            "dist/${ASSET}.sha256" \
            --repo "${{ github.repository }}" \
            --clobber
