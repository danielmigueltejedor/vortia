name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev nlohmann-json3-dev libhdf5-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DVORTIA_BUILD_UI=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libgtest-dev nlohmann-json3-dev libhdf5-dev
      - name: Configure (ASan+UBSan)
        run: |
          cmake -S . -B build -G Ninja -DVORTIA_BUILD_UI=OFF \
                -DCMAKE_CXX_COMPILER=clang++ -DVORTIA_ENABLE_SANITIZERS=ON \
                -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  openfoam-nozzle-mesh:
    # Geometry validation in a real OpenFOAM runtime, beyond string unit tests.
    # Ubuntu's distribution package is used for compatibility smoke testing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies and OpenFOAM
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev nlohmann-json3-dev libhdf5-dev openfoam python3-venv libglu1-mesa
      - name: Build mesh generator smoke tool
        run: |
          cmake -S . -B build -G Ninja -DVORTIA_BUILD_UI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target nozzle_mesh_export_smoke
      - name: Generate and validate real OpenFOAM wedge mesh
        shell: bash
        run: |
          set -euo pipefail
          case_dir="$RUNNER_TEMP/vortia-wedge-smoke"
          mkdir -p "$case_dir/system" "$case_dir/constant"
          cat > "$case_dir/system/controlDict" <<'EOF'
          FoamFile
          {
              version 2.0;
              format ascii;
              class dictionary;
              object controlDict;
          }
          application blockMesh;
          startFrom startTime;
          startTime 0;
          stopAt endTime;
          endTime 1;
          deltaT 1;
          writeControl timeStep;
          writeInterval 1;
          EOF
          cat > "$case_dir/system/fvSchemes" <<'EOF'
          FoamFile
          {
              version 2.0;
              format ascii;
              class dictionary;
              object fvSchemes;
          }
          ddtSchemes { default Euler; }
          gradSchemes { default Gauss linear; }
          divSchemes { default none; }
          laplacianSchemes { default Gauss linear corrected; }
          interpolationSchemes { default linear; }
          snGradSchemes { default corrected; }
          EOF
          cat > "$case_dir/system/fvSolution" <<'EOF'
          FoamFile
          {
              version 2.0;
              format ascii;
              class dictionary;
              object fvSolution;
          }
          solvers {}
          EOF
          build/bin/nozzle_mesh_export_smoke "$case_dir/system/blockMeshDict"
          # Ubuntu openfoam packaging can install to a prefixed directory.
          if [[ -f /usr/share/openfoam/etc/bashrc ]]; then
            set +u
            source /usr/share/openfoam/etc/bashrc
            set -u
          elif [[ -f /usr/lib/openfoam/openfoam1912/etc/bashrc ]]; then
            set +u
            source /usr/lib/openfoam/openfoam1912/etc/bashrc
            set -u
          fi
          command -v blockMesh || find /usr/lib/openfoam /opt -name blockMesh -type f 2>/dev/null || true
          command -v blockMesh
          blockMesh -case "$case_dir" | tee "$RUNNER_TEMP/blockMesh-nozzle.log"
          checkMesh -case "$case_dir" -allTopology -allGeometry | tee "$RUNNER_TEMP/checkMesh-nozzle.log"
          grep -q "Mesh OK" "$RUNNER_TEMP/checkMesh-nozzle.log"
      - name: Check partition preview and export with native Gmsh and OpenFOAM
        shell: bash
        run: |
          set -eo pipefail
          if [[ -f /usr/share/openfoam/etc/bashrc ]]; then
            source /usr/share/openfoam/etc/bashrc
          elif [[ -f /usr/lib/openfoam/openfoam1912/etc/bashrc ]]; then
            source /usr/lib/openfoam/openfoam1912/etc/bashrc
          fi
          python3 -m venv "$RUNNER_TEMP/vortia-gmsh"
          "$RUNNER_TEMP/vortia-gmsh/bin/pip" install gmsh==4.15.2
          VORTIA_REGION_CHECK_OPENFOAM=1 PYTHONDONTWRITEBYTECODE=1 \
            "$RUNNER_TEMP/vortia-gmsh/bin/python" resources/flow/test_mesh_regions_native.py

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja qt vtk googletest nlohmann-json hdf5
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix vtk);$(brew --prefix hdf5)"
      - name: Build
        run: cmake --build build
      - name: Verify Spanish catalog
        run: |
          test -s build/vortia_es.qm
          build/bin/vortia --verify-spanish
      - name: Build local macOS app bundle
        run: |
          cmake --build build --target vortia_macos_bundle
          test -f build/Vortia.app/Contents/MacOS/vortia
          test -s build/Vortia.app/Contents/Resources/Vortia.icns
          test -s build/Vortia.app/Contents/Resources/vortia_es.qm
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' build/Vortia.app/Contents/Info.plist
      - name: Test
        run: ctest --test-dir build --output-on-failure