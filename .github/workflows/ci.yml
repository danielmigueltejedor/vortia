name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev nlohmann-json3-dev libhdf5-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DVORTIA_BUILD_UI=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libgtest-dev nlohmann-json3-dev libhdf5-dev
      - name: Configure (ASan+UBSan)
        run: |
          cmake -S . -B build -G Ninja -DVORTIA_BUILD_UI=OFF \
                -DCMAKE_CXX_COMPILER=clang++ -DVORTIA_ENABLE_SANITIZERS=ON \
                -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja qt vtk googletest nlohmann-json hdf5
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix vtk);$(brew --prefix hdf5)"
      - name: Build
        run: cmake --build build
      - name: Verify Spanish catalog
        run: |
          test -s build/vortia_es.qm
          build/bin/vortia --verify-spanish
      - name: Build local macOS app bundle
        run: |
          cmake --build build --target vortia_macos_bundle
          test -f build/Vortia.app/Contents/MacOS/vortia
          test -s build/Vortia.app/Contents/Resources/Vortia.icns
          test -s build/Vortia.app/Contents/Resources/vortia_es.qm
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' build/Vortia.app/Contents/Info.plist
      - name: Test
        run: ctest --test-dir build --output-on-failure