[package]
name = "vortia-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop front end of the Vortia engine, drawn with egui in the Nodalia Design Language"

[lib]
name = "vortia_app"
path = "src/lib.rs"

[[bin]]
name = "vortia-app"
path = "src/main.rs"

[dependencies]
vortia-core = { path = "../vortia-core" }
vortia-fields = { path = "../vortia-fields" }
vortia-foamfile = { path = "../vortia-foamfile" }
vortia-mesh = { path = "../vortia-mesh" }
vortia-post = { path = "../vortia-post" }
vortia-solvers = { path = "../vortia-solvers" }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
nodalia-theme = { git = "https://github.com/getnodalia/nodalia-design", rev = "cafbb1f99eb88dbf3b4f51fb3594243955dc5704", features = ["egui", "engineering"] }

[dev-dependencies]
tempfile = "3"

# The shell's global menu, over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
