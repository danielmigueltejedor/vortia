[package]
name = "vortia-core"
version = "0.1.0"
edition = "2024"
description = "Vortia core library — Rust port (in progress)"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"