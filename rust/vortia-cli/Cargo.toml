[package]
name = "vortia-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line front end of the Vortia engine"

[[bin]]
name = "vortia"
path = "src/main.rs"

[dependencies]
vortia-core = { path = "../vortia-core" }
vortia-fields = { path = "../vortia-fields" }
vortia-foamfile = { path = "../vortia-foamfile" }
vortia-mesh = { path = "../vortia-mesh" }
vortia-solvers = { path = "../vortia-solvers" }
